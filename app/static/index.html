<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Multimodal Phishing Website Detection</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <div class="heading">
          <p class="eyebrow">Deep Learning Phishing Detector</p>
          <h1>Multimodal Phishing Website Detection</h1>
        </div>

        <form id="predict-form" class="form">
          <label for="url">Website URL</label>
          <div class="input-row">
            <input id="url" name="url" type="text" placeholder="https://example.com/login" autocomplete="off" />
            <button type="submit">Analyze</button>
          </div>
        </form>

        <section id="result" class="result hidden" aria-live="polite">
          <div>
            <p class="result-label">Result</p>
            <h2 id="label">-</h2>
            <p id="model-source" class="model-source"></p>
          </div>
          <div class="score">
            <span id="phishing-score">0%</span>
            <small id="score-label">model phishing score</small>
          </div>
        </section>

        <section id="explanation" class="explanation hidden">
          <h3>Recommendation</h3>
          <blockquote id="explanation-text"></blockquote>

          <h3>Observed Signals</h3>
          <p class="signals-note">These heuristic signals are independent of the Tri-Branch CNN and are not explanations of the model's decision.</p>
          <div class="risk-table-wrap">
            <table class="risk-table">
              <thead>
                <tr>
                  <th>Signal</th>
                  <th>Observation</th>
                </tr>
              </thead>
              <tbody id="risk-factors"></tbody>
            </table>
          </div>
        </section>

        <section id="features" class="features hidden"></section>
      </section>
    </main>

    <script src="/static/script.js"></script>
  </body>
</html>
